[package]
name = "encoder-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
encoder-core.workspace = true
encoder-client = { path = "../encoder-client" }
encoder-import = { path = "../encoder-import" }
encoder-filmcraft = { path = "../encoder-filmcraft" }
anyhow.workspace = true
keyring = "4"
serde.workspace = true
serde_json.workspace = true
# custom-protocol: serve the embedded UI (required for a standalone release build)
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
