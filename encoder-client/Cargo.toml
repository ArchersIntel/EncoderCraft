[package]
name = "encoder-client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "encraft"
path = "src/bin/encraft.rs"

[dependencies]
encoder-core.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
# `ring` instead of the default aws-lc-rs: no NASM/CMake needed to build on Windows.
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
